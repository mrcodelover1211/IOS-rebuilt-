<title>iOS Rebuilt</title>
<style>
:root {
  --wall: linear-gradient(160deg, #5b4bff 0%, #c14bd8 50%, #ff8a5b 100%);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bg: #f2f2f7; --card: #fff; --text: #000; --sub: #8e8e93; --sep: #e5e5ea; --blue: #007aff;
}
.dark { --bg: #000; --card: #1c1c1e; --text: #fff; --sub: #8e8e93; --sep: #38383a; --blue: #0a84ff; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: var(--font); overscroll-behavior: none; touch-action: manipulation; }
input, textarea, select { font: 17px var(--font); user-select: text; -webkit-user-select: text; }
button { font-family: var(--font); cursor: pointer; }
#phone { position: fixed; inset: 0; background: var(--wall); background-size: cover; background-position: center; overflow: hidden; }
@media (min-width: 600px) { #phone { width: 390px; height: 844px; max-height: 96vh; inset: 0; margin: auto; border-radius: 54px; border: 12px solid #111; box-shadow: 0 0 0 2px #444, 0 30px 80px rgba(0,0,0,.6); } body { background: #1a1a1a; } }

/* Status bar */
.status { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--sat) + 12px) 28px 0; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; z-index: 80; pointer-events: none; transition: color .2s; }
.status.darktext { color: #000; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.batt { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1px; opacity: .9; }
.batt i { display: block; height: 100%; width: 80%; background: currentColor; border-radius: 2px; }
.island { position: absolute; top: calc(var(--sat) + 8px); left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 90; transition: width .4s cubic-bezier(.2,.9,.25,1), height .4s; display: flex; align-items: center; justify-content: center; font-size: 13px; overflow: hidden; }
.island.wide { width: 220px; }
@media (max-width: 599px) { .island { display: none; } }

/* Lock screen */
#lock { position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; background: var(--wall); background-size: cover; background-position: center; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s; }
#lock.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
#lock .date { margin-top: calc(var(--sat) + 70px); font-size: 20px; font-weight: 500; opacity: .9; }
#lock .time { font-size: 92px; font-weight: 600; letter-spacing: -2px; line-height: 1; }
#lock .lnotes { width: 92%; margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
#lock .hint { position: absolute; bottom: calc(var(--sab) + 40px); font-size: 14px; opacity: .8; animation: bob 2s infinite; }
#lock .bar { position: absolute; bottom: calc(var(--sab) + 10px); width: 134px; height: 5px; background: #fff; border-radius: 3px; }
#lock .lbtn { position: absolute; bottom: calc(var(--sab) + 50px); width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,.3); backdrop-filter: blur(10px); display: grid; place-items: center; font-size: 22px; }
@keyframes bob { 50% { transform: translateY(-6px); opacity: .5; } }
#pass { position: absolute; inset: 0; z-index: 75; background: rgba(0,0,0,.55); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: none; flex-direction: column; align-items: center; padding-top: calc(var(--sat) + 90px); }
#pass.show { display: flex; }
#pass .dots { display: flex; gap: 18px; margin: 18px 0 40px; }
#pass .dots i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #fff; }
#pass .dots i.f { background: #fff; }
#pass .pad { display: grid; grid-template-columns: repeat(3, 78px); gap: 16px 26px; }
#pass .pad button { width: 78px; height: 78px; border-radius: 50%; border: 0; background: rgba(255,255,255,.2); color: #fff; font-size: 34px; }
#pass .pad button:active { background: rgba(255,255,255,.5); }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-12px); } 40%,80% { transform: translateX(12px); } }

/* Home screen */
#home { position: absolute; inset: 0; transition: transform .3s, filter .3s; }
#home.behind { transform: scale(.92); filter: blur(6px) brightness(.7); }
#pages { position: absolute; top: calc(var(--sat) + 56px); left: 0; right: 0; bottom: calc(var(--sab) + 140px); display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
#pages::-webkit-scrollbar { display: none; }
.page { min-width: 100%; scroll-snap-align: start; padding: 0 20px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 92px; column-gap: 10px; align-content: start; }
.dots-nav { position: absolute; bottom: calc(var(--sab) + 118px); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
.dots-nav i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); }
.dots-nav i.on { background: #fff; }
.widget { grid-column: span 2; grid-row: span 2; border-radius: 22px; padding: 14px; background: rgba(255,255,255,.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); margin-bottom: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
.widget .big { font-size: 40px; font-weight: 300; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
.icon { width: 62px; height: 62px; border-radius: 15px; display: grid; place-items: center; font-size: 32px; box-shadow: 0 4px 12px rgba(0,0,0,.25); transition: transform .15s; position: relative; }
.app:active .icon { transform: scale(.88); filter: brightness(.8); }
.app span.n { font-size: 11.5px; text-shadow: 0 1px 3px rgba(0,0,0,.5); white-space: nowrap; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #ff3b30; font-size: 13px; font-weight: 600; display: grid; place-items: center; }
.wiggle .icon { animation: wig .25s infinite alternate; }
.wiggle .app .del { display: grid; }
.del { display: none; position: absolute; top: -6px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: rgba(120,120,120,.9); place-items: center; font-size: 14px; z-index: 2; }
.app.picked .icon { outline: 3px solid #fff; }
@keyframes wig { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
.dock { position: absolute; left: 12px; right: 12px; bottom: calc(var(--sab) + 12px); padding: 14px 16px; border-radius: 32px; background: rgba(255,255,255,.22); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; justify-content: space-around; }
.dock .app span.n { display: none; }
.donebtn { position: absolute; top: calc(var(--sat) + 10px); right: 20px; z-index: 85; background: rgba(255,255,255,.3); border: 0; color: #fff; padding: 6px 14px; border-radius: 14px; font-weight: 600; display: none; }
.wiggle-on .donebtn { display: block; }
.spot { position: absolute; bottom: calc(var(--sab) + 108px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.25); backdrop-filter: blur(20px); padding: 5px 12px; border-radius: 14px; font-size: 13px; cursor: pointer; display: none; }
.home-bar { position: absolute; bottom: calc(var(--sab) + 4px); left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.6); }

/* Windows */
.window { position: absolute; inset: 0; z-index: 50; background: var(--bg); color: var(--text); display: flex; flex-direction: column; transform: scale(.2); opacity: 0; transition: transform .35s cubic-bezier(.2,.9,.25,1), opacity .25s, border-radius .35s; border-radius: 40px; overflow: hidden; }
.window.open { transform: scale(1); opacity: 1; border-radius: 0; }
.window.closing { transform: scale(.2); opacity: 0; border-radius: 40px; }
.window.darkwin { --bg: #000; --card: #1c1c1e; --text: #fff; --sep: #38383a; }
.nav { padding: calc(var(--sat) + 50px) 16px 6px; display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
.nav h1 { font-size: 34px; font-weight: 700; }
.navbar { padding: calc(var(--sat) + 50px) 12px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 600; }
.wbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--sab) + 40px); }
.closer { position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--sab) + 26px); display: flex; justify-content: center; align-items: flex-end; padding-bottom: calc(var(--sab) + 6px); z-index: 10; cursor: pointer; }
.closer i { width: 134px; height: 5px; border-radius: 3px; background: var(--text); opacity: .5; }
.link { background: none; border: 0; color: var(--blue); font-size: 17px; padding: 6px 2px; }
.link.red { color: #ff3b30; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 22px; }
.cell { padding: 11px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: center; border-bottom: .5px solid var(--sep); font-size: 17px; min-height: 44px; cursor: pointer; }
.cell:last-child { border-bottom: 0; }
.cell:active { background: var(--sep); }
.cell .l { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
.cell .l > div { min-width: 0; }
.cell small { color: var(--sub); font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .r { color: var(--sub); white-space: nowrap; }
.sq { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
.label { font-size: 13px; color: var(--sub); text-transform: uppercase; margin: 0 16px 6px; }
.search { width: 100%; padding: 8px 12px; border-radius: 10px; border: 0; background: var(--sep); color: var(--text); margin-bottom: 14px; outline: none; }
.field { width: 100%; padding: 12px 14px; border: 0; background: var(--card); color: var(--text); border-radius: 10px; outline: none; margin-bottom: 10px; }
.pbtn { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.pbtn.gray { background: var(--card); color: var(--blue); }
.empty { text-align: center; color: var(--sub); padding: 40px 0; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: #e9e9ea; position: relative; transition: background .2s; flex-shrink: 0; }
.dark .switch { background: #39393d; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on { background: #34c759; }
.switch.on::after { transform: translateX(20px); }
.seg { display: flex; background: var(--sep); border-radius: 9px; padding: 2px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text); }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.tabs { display: flex; justify-content: space-around; border-top: .5px solid var(--sep); padding: 6px 0 calc(var(--sab) + 26px); background: var(--card); }
.tabs button { border: 0; background: none; color: var(--sub); font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button b { font-size: 22px; font-weight: normal; }
.tabs button.on { color: var(--blue); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(#a8adb8, #858994); color: #fff; display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }

/* Banner notifications */
#banner { position: absolute; top: calc(var(--sat) + 8px); left: 8px; right: 8px; z-index: 95; background: rgba(245,245,245,.85); color: #000; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; transform: translateY(-150%); transition: transform .4s cubic-bezier(.2,.9,.25,1); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
#banner.show { transform: none; }
.ncard { background: rgba(255,255,255,.3); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 18px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.ncard .sq { width: 36px; height: 36px; }

/* Control Center */
#cc { position: absolute; inset: 0; z-index: 88; background: rgba(0,0,0,.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: calc(var(--sat) + 60px) 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start; transform: translateY(-100%); transition: transform .35s cubic-bezier(.2,.9,.25,1); }
#cc.open { transform: none; }
.tile { background: rgba(255,255,255,.18); border-radius: 22px; padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; justify-items: center; }
.tog { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.25); border: 0; font-size: 24px; }
.tog.on { background: var(--blue); }
.tog.on.orange { background: #ff9f0a; }
.slider { background: rgba(255,255,255,.18); border-radius: 22px; height: 150px; position: relative; overflow: hidden; touch-action: none; }
.slider i { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; height: 60%; }
.slider span { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 24px; }
.ccmusic { grid-column: span 2; background: rgba(255,255,255,.18); border-radius: 22px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
.ccmusic button { background: none; border: 0; color: #fff; font-size: 26px; }
#dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 200; }

/* Switcher */
#switcher { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: none; align-items: center; overflow-x: auto; gap: 18px; padding: 0 40px; scroll-snap-type: x mandatory; }
#switcher.show { display: flex; }
.card { min-width: 70%; height: 65%; border-radius: 30px; background: #333; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 60px; position: relative; transition: transform .3s, opacity .3s; }
.card span { font-size: 16px; }
.card.gone { transform: translateY(-120%); opacity: 0; }

/* Spotlight */
#spotlight { position: absolute; inset: 0; z-index: 65; background: rgba(0,0,0,.45); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: calc(var(--sat) + 60px) 16px; display: none; flex-direction: column; }
#spotlight.show { display: flex; }
#spotlight input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 0; background: rgba(255,255,255,.2); color: #fff; outline: none; }
#spotlight input::placeholder { color: rgba(255,255,255,.6); }
#spotRes { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; margin-top: 20px; }

/* App-specific */
.calc { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 0 16px calc(var(--sab) + 36px); }
.calc .out { font-size: 80px; font-weight: 300; text-align: right; padding: 0 12px 10px; overflow: hidden; white-space: nowrap; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.keys button { aspect-ratio: 1; border: 0; border-radius: 50%; font-size: 32px; background: #333; color: #fff; }
.keys button:active { filter: brightness(1.6); }
.keys .fn { background: #a5a5a5; color: #000; }
.keys .op { background: #ff9f0a; }
.keys .op.on { background: #fff; color: #ff9f0a; }
.keys .zero { grid-column: span 2; aspect-ratio: auto; border-radius: 40px; text-align: left; padding-left: 30px; }
textarea.note { width: 100%; height: 100%; min-height: 60vh; border: 0; background: transparent; resize: none; outline: none; color: var(--text); }
.bigclock { font-size: 76px; font-weight: 200; text-align: center; margin: 30px 0; font-variant-numeric: tabular-nums; }
.row { display: flex; justify-content: space-between; padding: 0 10px; }
.circle { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--bg); outline: 2px solid #333; font-size: 17px; color: #fff; background: #333; }
.circle.go { background: #0a3a17; color: #30d158; outline-color: #0a3a17; }

.circle.pause { background: #3a2a0a; color: #ff9f0a; outline-color: #3a2a0a; }
.laps div { display: flex; justify-content: space-between; padding: 12px 6px; border-bottom: .5px solid var(--sep); font-variant-numeric: tabular-nums; }
.dial { display: grid; grid-template-columns: repeat(3, 78px); gap: 16px 26px; justify-content: center; margin-top: 10px; }
.dial button { width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--sep); color: var(--text); font-size: 32px; line-height: 1; }
.dial button small { display: block; font-size: 10px; letter-spacing: 2px; }
.callbtn { width: 78px; height: 78px; border-radius: 50%; border: 0; background: #34c759; color: #fff; font-size: 32px; margin: 18px auto 0; display: block; }
.bubbles { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
.bub { max-width: 75%; padding: 8px 13px; border-radius: 18px; font-size: 16px; line-height: 1.3; word-wrap: break-word; user-select: text; }
.bub.me { align-self: flex-end; background: var(--blue); color: #fff; }
.bub.them { align-self: flex-start; background: var(--sep); color: var(--text); }
.composer { display: flex; gap: 8px; padding: 8px 12px calc(var(--sab) + 30px); border-top: .5px solid var(--sep); background: var(--bg); }
.composer input { flex: 1; padding: 8px 14px; border-radius: 18px; border: 1px solid var(--sep); background: var(--bg); color: var(--text); outline: none; }
.composer button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; font-size: 18px; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 -16px; }
.pgrid div { aspect-ratio: 1; background-size: cover; background-position: center; cursor: pointer; }
.viewer { position: absolute; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; }
.viewer img { flex: 1; object-fit: contain; width: 100%; min-height: 0; }
.viewer .vbar { display: flex; justify-content: space-around; padding: 12px 0 calc(var(--sab) + 30px); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; row-gap: 6px; }
.month b { font-size: 12px; color: var(--sub); font-weight: 500; }
.month span { padding: 8px 0; border-radius: 50%; width: 38px; height: 38px; margin: auto; font-size: 17px; position: relative; cursor: pointer; }
.month span.today { color: #ff3b30; font-weight: 700; }
.month span.sel { background: #ff3b30; color: #fff; }
.month span.has::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--sub); }
.chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c7c7cc; flex-shrink: 0; display: grid; place-items: center; }
.chk.on { background: #ff9f0a; border-color: #ff9f0a; }
.chk.on::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.store-card { background: var(--card); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.store-card .icon { width: 56px; height: 56px; font-size: 28px; border-radius: 13px; box-shadow: none; }
.getbtn { border: 0; background: var(--sep); color: var(--blue); font-weight: 700; padding: 6px 18px; border-radius: 16px; font-size: 15px; }
.art { width: 72%; aspect-ratio: 1; margin: 20px auto; border-radius: 14px; display: grid; place-items: center; font-size: 100px; box-shadow: 0 20px 40px rgba(0,0,0,.3); transition: transform .4s; }

.mctl { display: flex; justify-content: space-around; font-size: 40px; margin: 20px 0; }
.mctl button { background: none; border: 0; color: var(--text); font-size: 40px; }

.cloudbar { height: 10px; border-radius: 5px; background: var(--sep); overflow: hidden; display: flex; margin: 10px 0; }
.toast { position: absolute; bottom: calc(var(--sab) + 90px); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 15px; z-index: 99; }
</style>

    <div class="dots-nav" id="dotsNav"></div>
    <div class="spot" id="spotBtn" style="display:block">🔍 Search</div>
    <div class="dock" id="dock"></div>
    <div class="home-bar" id="homeBar"></div>
  </div>

  <div id="switcher"></div>
  <div id="spotlight"><input id="spotIn" placeholder="Search apps"><div id="spotRes"></div></div>

  <div id="lock">
    <div class="date" id="lockDate"></div>
    <div class="time" id="lockTime"></div>
    <div class="lnotes" id="lockNotes"></div>
    <div class="lbtn" style="left:40px" id="lockTorch">🔦</div>
    <div class="lbtn" style="right:40px" id="lockCam">📷</div>
    <div class="hint">⌃ Swipe up to open</div>
    <div class="bar"></div>
  </div>
  <div id="pass"><div>🔒</div><div style="margin-top:10px">Enter Passcode</div><div class="dots" id="passDots"></div><div class="pad" id="passPad"></div><button class="link" style="color:#fff;margin-top:24px" id="passCancel">Cancel</button></div>

  <div id="cc">
    <div class="tile">
      <button class="tog orange" data-t="plane">✈️</button><button class="tog on" data-t="cell">📶</button>
      <button class="tog on" data-t="wifi">🛜</button><button class="tog on" data-t="bt">🔵</button>
    </div>
    <div class="ccmusic"><div><div style="font-size:13px;opacity:.7">Now Playing</div><div id="ccSong">Not Playing</div></div><div><button id="ccPrev">⏮</button><button id="ccPlay">▶️</button><button id="ccNext">⏭</button></div></div>
    <div class="tile">
      <button class="tog" data-t="rot">🔒</button><button class="tog" data-t="dnd">🌙</button>
      <button class="tog" id="torch">🔦</button><button class="tog" id="ccDark">🌗</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="slider" id="bright"><i></i><span>☀️</span></div><div class="slider" id="vol"><i></i><span>🔊</span></div></div>
    <div class="tile" style="grid-column:span 2;grid-template-columns:repeat(4,1fr)">
      <button class="tog" data-open="clock">⏱️</button><button class="tog" data-open="calc">🧮</button><button class="tog" data-open="camera">📷</button><button class="tog" data-open="voice">🎙️</button>
    </div>
  </div>

  <div id="banner"><div class="sq" id="bnIco"></div><div style="flex:1;min-width:0"><b id="bnTitle" style="font-size:15px"></b><div id="bnMsg" style="font-size:14px"></div></div><small style="color:#666">now</small></div>
</div>
<div id="dim"></div>

<script>
'use strict';
/* =====================================================================
   CORE HELPERS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtTime = d => new Date(d).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDate = d => new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric' });

/* Storage — everything lives on-device in localStorage, namespaced. "Cloud" backs it up. */
const NS = 'iosr:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch { toast('Storage full — delete some photos'); return false; } },
  all() { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(NS)) o[k.slice(NS.length)] = JSON.parse(localStorage.getItem(k)); } } catch {} return o; },
  clear() { try { Object.keys(this.all()).forEach(k => localStorage.removeItem(NS + k)); } catch {} },
  bytes() { let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(NS)) n += (localStorage.getItem(k) || '').length * 2; } } catch {} return n; }
};
const settings = Object.assign({ dark: false, passcode: '', name: '', email: '', cloud: false, dnd: false, haptics: true, wall: null, c: '°C' }, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);

function toast(msg) { const t = h(`<div class="toast">${esc(msg)}</div>`); $('#phone').appendChild(t); setTimeout(() => t.remove(), 1800); }
function ask(q, def = '') { const r = prompt(q, def); return r === null ? null : r.trim(); }

/* Notifications: banner + lock screen list + badge counts */
let notifs = store.get('notifs', []);
let bannerTimer;
function notify(appId, title, msg) {
  const a = APPS[appId] || { icon: '🔔', bg: '#888' };
  notifs.unshift({ id: uid(), app: appId, title, msg, t: Date.now() }); notifs = notifs.slice(0, 20); store.set('notifs', notifs);
  renderLockNotes();
  if (settings.dnd) return;
  $('#bnIco').style.background = a.bg; $('#bnIco').textContent = a.icon;
  $('#bnTitle').textContent = title; $('#bnMsg').textContent = msg;
  $('#banner').classList.add('show'); buzz(20); island(a.icon + ' ' + title);
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('#banner').classList.remove('show'), 3500);
  $('#banner').onclick = () => { $('#banner').classList.remove('show'); unlockedOpen(appId); };
}
function renderLockNotes() {
  const box = $('#lockNotes'); box.innerHTML = '';
  notifs.slice(0, 3).forEach(n => { const a = APPS[n.app] || { icon: '🔔', bg: '#888' }; box.appendChild(h(`<div class="ncard"><div class="sq" style="background:${a.bg}">${a.icon}</div><div style="flex:1;min-width:0"><b>${esc(n.title)}</b><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n.msg)}</div></div><small>${fmtTime(n.t)}</small></div>`)); });
  if (notifs.length) { const c = h(`<div style="text-align:center;font-size:13px;opacity:.8;cursor:pointer">Clear notifications</div>`); c.onclick = e => { e.stopPropagation(); notifs = []; store.set('notifs', notifs); renderLockNotes(); }; box.appendChild(c); }
}
function island(text) { const i = $('#island'); i.textContent = text; i.classList.add('wide'); clearTimeout(i._t); i._t = setTimeout(() => { i.classList.remove('wide'); i.textContent = ''; }, 2500); }

/* =====================================================================
   APP REGISTRY — add your own app here! Each app gets:
     render(win, body) → build UI inside `body` (a .wbody div) or replace win content.
     dark: true → dark window chrome.  external: url → opens a link instead.
   ===================================================================== */
const APPS = {};
function defineApp(id, def) { APPS[id] = Object.assign({ id, name: id, icon: '❓', bg: '#888' }, def); }

/* =====================================================================
   SYSTEM: clock, lock, passcode, appearance
   ===================================================================== */
function applyAppearance() {
  document.documentElement.classList.toggle('dark', settings.dark);
  document.documentElement.style.setProperty('--wall', settings.wall || WALLS[0]);
  $('#ccDark').classList.toggle('on', settings.dark);
}
const WALLS = [
  'linear-gradient(160deg,#5b4bff 0%,#c14bd8 50%,#ff8a5b 100%)',
  'linear-gradient(160deg,#0f2027,#203a43,#2c5364)',
  'linear-gradient(160deg,#ff9a9e,#fad0c4)',
  'linear-gradient(160deg,#11998e,#38ef7d)',
  'linear-gradient(160deg,#000,#434343)',
  'linear-gradient(160deg,#f12711,#f5af19)',
  'radial-gradient(circle at 30% 20%,#ff6a88,#5a2a9f 60%,#0b0b2b)',
  'linear-gradient(200deg,#89f7fe,#66a6ff)',
];
function tick() {
  const d = new Date();
  const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  $('#sbTime').textContent = t; $('#lockTime').textContent = t;
  $('#lockDate').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  checkAlarms(d);
  $$('[data-clockw]').forEach(e => e.textContent = t);
}
if (navigator.getBattery) navigator.getBattery().then(b => { const u = () => $('#battLvl').style.width = Math.round(b.level * 100) + '%'; u(); b.onlevelchange = u; }).catch(() => {});

const lock = $('#lock');
let lockY = null;
function tryUnlock() {
  if (settings.passcode) { showPass(); return; }
  lock.classList.add('hidden'); buzz();
}
lock.addEventListener('touchstart', e => lockY = e.touches[0].clientY, { passive: true });
lock.addEventListener('touchmove', e => { if (lockY == null) return; const dy = Math.min(0, e.touches[0].clientY - lockY); lock.style.transition = 'none'; lock.style.transform = `translateY(${dy}px)`; }, { passive: true });
lock.addEventListener('touchend', e => { const dy = e.changedTouches[0].clientY - lockY; lock.style.transition = ''; lock.style.transform = ''; lockY = null; if (dy < -80) tryUnlock(); });
lock.addEventListener('click', e => { if (e.target.closest('.lbtn') || e.target.closest('.ncard')) return; tryUnlock(); });
$('#lockTorch').onclick = () => $('#torch').click();
$('#lockCam').onclick = () => { lock.classList.add('hidden'); openApp('camera'); };
function lockNow() { lock.classList.remove('hidden'); closeAll(true); $('#cc').classList.remove('open'); $('#switcher').classList.remove('show'); $('#spotlight').classList.remove('show'); }
document.addEventListener('visibilitychange', () => { if (document.hidden && settings.passcode) lockNow(); });

let passBuf = '', passAfter = null;
function showPass() {
  passBuf = ''; drawPass(); $('#pass').classList.add('show');
}
function drawPass() { $('#passDots').innerHTML = [0,1,2,3].map(i => `<i class="${i < passBuf.length ? 'f' : ''}"></i>`).join(''); }
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
  const b = h(`<button style="${k ? '' : 'visibility:hidden'}">${k}</button>`);
  b.onclick = () => {
    buzz();
    if (k === '⌫') passBuf = passBuf.slice(0, -1); else passBuf += k;
    drawPass();
    if (passBuf.length === 4) {
      if (passBuf === settings.passcode) { $('#pass').classList.remove('show'); lock.classList.add('hidden'); if (passAfter) { passAfter(); passAfter = null; } }
      else { $('#passDots').classList.add('shake'); buzz(200); setTimeout(() => { $('#passDots').classList.remove('shake'); passBuf = ''; drawPass(); }, 400); }
    }
  };
  $('#passPad').appendChild(b);
});
$('#passCancel').onclick = () => $('#pass').classList.remove('show');
function unlockedOpen(id) { if (!lock.classList.contains('hidden')) { if (settings.passcode) { passAfter = () => openApp(id); showPass(); return; } lock.classList.add('hidden'); } openApp(id); }

/* =====================================================================
   HOME SCREEN: pages, dock, widgets, jiggle mode, spotlight, switcher
   ===================================================================== */
const DEFAULT_LAYOUT = [
  ['@clockw', '@weatherw', 'calendar', 'photos', 'camera', 'maps', 'weather', 'clock', 'notes', 'reminders', 'appstore', 'settings'],
  ['calc', 'contacts', 'music', 'cloud', 'compass', 'voice', 'files', 'health', 'news', 'tips']
];
let layout = store.get('layout', DEFAULT_LAYOUT);
const DOCK = ['phone', 'safari', 'messages', 'music'];
let removed = store.get('removed', []);
let wiggling = false, picked = null;

function appEl(id, inDock) {
  const a = APPS[id]; if (!a) return document.createElement('div');
  const el = h(`<div class="app" data-id="${id}"><div class="icon" style="background:${a.bg}">${a.icon}</div><span class="n">${esc(a.name)}</span>${inDock ? '' : '<div class="del">−</div>'}</div>`);
  const badge = a.badge ? a.badge() : 0;
  if (badge) el.querySelector('.icon').appendChild(h(`<div class="badge">${badge}</div>`));
  let timer;
  const start = () => { timer = setTimeout(() => { setWiggle(true); buzz(30); }, 550); };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('mousedown', start);
  ['touchend', 'touchmove', 'mouseup', 'mouseleave'].forEach(ev => el.addEventListener(ev, () => clearTimeout(timer), { passive: true }));
  el.addEventListener('click', e => {
    if (e.target.classList.contains('del')) { e.stopPropagation(); removeApp(id); return; }
    if (wiggling) { if (inDock) return; swapPick(id); return; }
    openApp(id, el);
  });
  return el;
}
function widgetEl(kind) {
  if (kind === '@clockw') {
    const w = h(`<div class="widget"><div style="font-size:13px;opacity:.8" id="wdDay"></div><div class="big" data-clockw></div><div style="font-size:13px;opacity:.8" id="wdNext">No events today</div></div>`);
    const d = new Date(); w.querySelector('#wdDay').textContent = d.toLocaleDateString([], { weekday: 'long' }).toUpperCase() + ' ' + d.getDate();
    const evs = store.get('events', []).filter(e => e.date === dayKey(d));
    if (evs.length) w.querySelector('#wdNext').textContent = '📅 ' + evs[0].title;
    w.onclick = () => !wiggling && openApp('calendar'); return w;
  }
  if (kind === '@weatherw') {
    const wx = store.get('wxcache', null);
    const w = h(`<div class="widget" style="background:linear-gradient(#2a6fdb,#7cb4ff)"><div style="font-size:14px;font-weight:600">${esc(wx?.city || 'Weather')} ➤</div><div class="big">${wx ? Math.round(wx.temp) + '°' : '--°'}</div><div style="font-size:13px">${esc(wx ? wx.desc : 'Tap to load')}<br>${wx ? `H:${Math.round(wx.hi)}° L:${Math.round(wx.lo)}°` : ''}</div></div>`);
    w.onclick = () => !wiggling && openApp('weather'); return w;
  }
}
function renderHome() {
  const pages = $('#pages'); const scroll = pages.scrollLeft; pages.innerHTML = '';
  const placed = new Set();
  layout.forEach(p => {
    const pg = h('<div class="page"></div>');
    p.forEach(id => { if (id.startsWith('@')) pg.appendChild(widgetEl(id)); else if (APPS[id] && !removed.includes(id)) { pg.appendChild(appEl(id)); placed.add(id); } });
    pages.appendChild(pg);
  });
  // apps installed but not on any page go on the last page
  const extra = Object.keys(APPS).filter(id => !placed.has(id) && !DOCK.includes(id) && !removed.includes(id) && !APPS[id].hidden);
  if (extra.length) { extra.forEach(id => layout[layout.length - 1].push(id)); store.set('layout', layout); return renderHome(); }
  const dock = $('#dock'); dock.innerHTML = ''; DOCK.forEach(id => dock.appendChild(appEl(id, true)));
  pages.scrollLeft = scroll; drawDots();
}
function drawDots() { const n = layout.length, i = Math.round($('#pages').scrollLeft / ($('#pages').clientWidth || 1)); $('#dotsNav').innerHTML = Array.from({ length: n }, (_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join(''); }
$('#pages').addEventListener('scroll', drawDots, { passive: true });
function setWiggle(on) { wiggling = on; picked = null; $('#home').classList.toggle('wiggle', on); $('#home').classList.toggle('wiggle-on', on); $$('.app.picked').forEach(e => e.classList.remove('picked')); }
$('#doneBtn').onclick = () => setWiggle(false);
function swapPick(id) {
  if (!picked) { picked = id; $(`#pages .app[data-id="${id}"]`)?.classList.add('picked'); return; }
  if (picked === id) { picked = null; $$('.app.picked').forEach(e => e.classList.remove('picked')); return; }
  const find = x => { for (let p = 0; p < layout.length; p++) { const i = layout[p].indexOf(x); if (i > -1) return [p, i]; } };
  const A = find(picked), B = find(id);
  if (A && B) { [layout[A[0]][A[1]], layout[B[0]][B[1]]] = [layout[B[0]][B[1]], layout[A[0]][A[1]]]; store.set('layout', layout); }
  renderHome(); setWiggle(true); buzz();
}
function removeApp(id) {
  if (['settings', 'appstore'].includes(id)) return toast("Can't remove " + APPS[id].name);
  if (!confirm(`Remove "${APPS[id].name}"? You can get it back from the App Store.`)) return;
  removed.push(id); store.set('removed', removed);
  layout = layout.map(p => p.filter(x => x !== id)); store.set('layout', layout); renderHome(); setWiggle(true);
}
function installApp(id) {
  removed = removed.filter(x => x !== id); store.set('removed', removed);
  if (!layout.some(p => p.includes(id))) { let last = layout[layout.length - 1]; if (last.length >= 24) { last = []; layout.push(last); } last.push(id); store.set('layout', layout); }
  renderHome();
}

/* Spotlight */
$('#spotBtn').onclick = () => { $('#spotlight').classList.add('show'); $('#spotIn').value = ''; drawSpot(); setTimeout(() => $('#spotIn').focus(), 50); };
$('#spotIn').oninput = drawSpot;
function drawSpot() {
  const q = $('#spotIn').value.toLowerCase(); const r = $('#spotRes'); r.innerHTML = '';
  Object.values(APPS).filter(a => !a.hidden && !removed.includes(a.id) && a.name.toLowerCase().includes(q)).forEach(a => { const el = appEl(a.id, true); el.querySelector('.n').style.display = 'block'; el.onclick = () => { $('#spotlight').classList.remove('show'); openApp(a.id); }; r.appendChild(el); });
  if (q && settings && store.get('notes', []).some(n => n.text.toLowerCase().includes(q))) r.appendChild(h(`<div style="grid-column:span 4;font-size:14px;opacity:.8">📝 Matches in Notes</div>`));
}
$('#spotlight').addEventListener('click', e => { if (e.target.id === 'spotlight') $('#spotlight').classList.remove('show'); });

/* =====================================================================
   WINDOW MANAGER
   ===================================================================== */
const running = []; // app ids, most recent last
let current = null;
function openApp(id) {
  const a = APPS[id]; if (!a) return;
  if (a.external) { window.open(a.external, '_blank'); return; }
  $('#switcher').classList.remove('show'); $('#cc').classList.remove('open');
  closeAll(true);
  const win = h(`<div class="window ${a.dark ? 'darkwin' : ''}" data-app="${id}"></div>`);
  $('#phone').appendChild(win);
  const body = document.createElement('div'); body.className = 'wbody';
  try { a.render(win, body); } catch (err) { console.error(err); win.innerHTML = `<div class="nav"><h1>${esc(a.name)}</h1></div><div class="wbody"><div class="empty">This app crashed 💥<br><small>${esc(err.message)}</small></div></div>`; }
  if (!win.contains(body) && !win.children.length) win.appendChild(body);
  const closer = h('<div class="closer"><i></i></div>'); win.appendChild(closer);
  let y0 = null;
  closer.addEventListener('touchstart', e => y0 = e.touches[0].clientY, { passive: true });
  closer.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.min(0, e.touches[0].clientY - y0); win.style.transition = 'none'; win.style.transform = `scale(${1 + dy / 1200}) translateY(${dy / 2}px)`; win.style.borderRadius = Math.min(40, -dy / 4) + 'px'; }, { passive: true });
  closer.addEventListener('touchend', e => { const dy = e.changedTouches[0].clientY - y0; y0 = null; win.style.transition = ''; win.style.transform = ''; win.style.borderRadius = ''; if (dy < -150) openSwitcher(); else if (dy < -20) closeAll(); });
  closer.addEventListener('click', () => closeAll());
  new MutationObserver(() => { if (win.lastElementChild !== closer && !win.querySelector('.viewer')) win.appendChild(closer); }).observe(win, { childList: true });
  requestAnimationFrame(() => requestAnimationFrame(() => win.classList.add('open')));
  $('#home').classList.add('behind');
  $('#status').classList.toggle('darktext', !a.dark && !settings.dark && !a.fullbleed);
  current = id; const i = running.indexOf(id); if (i > -1) running.splice(i, 1); running.push(id);
  buzz();
}
function closeAll(instant) {
  $$('.window').forEach(w => {
    if (w._cleanup) try { w._cleanup(); } catch {}
    if (instant) w.remove(); else { w.classList.add('closing'); w.classList.remove('open'); setTimeout(() => w.remove(), 350); }
  });
  $('#home').classList.remove('behind'); $('#status').classList.remove('darktext'); current = null;
  renderHome();
}
function openSwitcher() {
  closeAll(true);
  const s = $('#switcher'); s.innerHTML = '';
  if (!running.length) { s.appendChild(h('<div style="margin:auto;opacity:.8">No Recent Apps</div>')); }
  [...running].reverse().forEach(id => {
    const a = APPS[id]; if (!a) return;
    const c = h(`<div class="card" style="background:${a.bg}">${a.icon}<span>${esc(a.name)}</span></div>`);
    let y0;
    c.addEventListener('touchstart', e => y0 = e.touches[0].clientY, { passive: true });
    c.addEventListener('touchend', e => { const dy = e.changedTouches[0].clientY - y0; if (dy < -80) { c.classList.add('gone'); running.splice(running.indexOf(id), 1); setTimeout(() => c.remove(), 300); buzz(); } else if (Math.abs(dy) < 10) { s.classList.remove('show'); openApp(id); } });
    c.addEventListener('click', e => { if (!('ontouchstart' in window)) { s.classList.remove('show'); openApp(id); } });
    s.appendChild(c);
  });
  s.classList.add('show');
}
$('#switcher').addEventListener('click', e => { if (e.target.id === 'switcher') $('#switcher').classList.remove('show'); });
// Swipe up on home bar → switcher (on home screen)
let hb0;
$('#homeBar').addEventListener('touchstart', e => hb0 = e.touches[0].clientY, { passive: true });
$('#homeBar').addEventListener('touchend', e => { if (hb0 - e.changedTouches[0].clientY > 40) openSwitcher(); });
$('#homeBar').addEventListener('click', openSwitcher);

/* Helper to build a standard "large title" page */
function page(win, title, opts = {}) {
  win.innerHTML = '';
  const nav = h(`<div class="nav"><h1>${esc(title)}</h1><div class="actions"></div></div>`);
  if (opts.back) { const b = h(`<button class="link">‹ ${esc(opts.backLabel || 'Back')}</button>`); b.onclick = opts.back; nav.prepend(b); nav.style.flexWrap = 'wrap'; nav.querySelector('h1').style.width = '100%'; nav.querySelector('h1').style.order = 3; }
  (opts.actions || []).forEach(([label, fn]) => { const b = h(`<button class="link">${label}</button>`); b.onclick = fn; nav.querySelector('.actions').appendChild(b); });
  const body = h('<div class="wbody"></div>');
  win.append(nav, body);
  if (win.querySelector('.closer')) win.appendChild(win.querySelector('.closer'));
  return body;
}
function list(rows) {
  const l = h('<div class="list"></div>');
  rows.forEach(r => { const c = h(`<div class="cell"><div class="l">${r.icon ? `<div class="sq" style="background:${r.bg || '#888'}">${r.icon}</div>` : ''}${r.left || ''}<div><div>${esc(r.title)}</div>${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div></div><div class="r">${r.right ?? ''}</div></div>`); if (r.onclick) c.onclick = r.onclick; else c.style.cursor = 'default'; if (r.onEl) r.onEl(c); l.appendChild(c); });
  return l;
}
function switchEl(on, fn) { const s = h(`<div class="switch ${on ? 'on' : ''}"></div>`); s.onclick = e => { e.stopPropagation(); s.classList.toggle('on'); buzz(); fn(s.classList.contains('on')); }; return s; }
function pickImage(capture) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (capture) i.capture = 'environment';

   backups you can download, restore, or move to another device.
   ===================================================================== */
let cloudTimer;
function cloudSync() {
  if (!settings.cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => {
    const snap = store.all(); delete snap.cloudBackups;
    const backups = store.get('cloudBackups', []);
    backups.unshift({ t: Date.now(), size: JSON.stringify(snap).length });
    store.set('cloudBackups', backups.slice(0, 5));
    store.set('lastSync', Date.now());
  }, 1500);
}
function exportBackup() {
  const data = store.all(); data._meta = { app: 'iOS Rebuilt', version: 2, t: Date.now() };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ios-rebuilt-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
}
function importBackup() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
  i.onchange = () => { const f = i.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => {
    try { const d = JSON.parse(rd.result); if (!d._meta) throw new Error('Not an iOS Rebuilt backup'); if (!confirm('Restore this backup? Current data will be replaced.')) return; store.clear(); Object.entries(d).forEach(([k, v]) => k !== '_meta' && store.set(k, v)); location.reload(); }
    catch (e) { alert('Restore failed: ' + e.message); } }; rd.readAsText(f); };
  i.click();
}

  function prev() { pause(); idx = (idx - 1 + songs.length) % songs.length; pos = 0; play(); }

  let cur = '0', prev = null, op = null, fresh = false;
  const fmt = n => { if (!isFinite(n)) return 'Error'; const s = String(+parseFloat(n).toPrecision(10)); return s.length > 9 ? (+s).toExponential(4) : (+s).toLocaleString('en-US', { maximumFractionDigits: 8 }); };

  const calc = (a, b, o) => ({ '+': a + b, '−': a - b, '×': a * b, '÷': a / b })[o];
  ['AC', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '='].forEach(k => {
    const b = h(`<button>${k}</button>`); b.className = ['AC', '±', '%'].includes(k) ? 'fn' : '÷×−+='.includes(k) ? 'op' : k === '0' ? 'zero' : '';

      else if (key === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; }
      else if (key === 'AC') { cur = '0'; prev = op = null; }
      else if (key === 'C') { cur = '0'; }
      else if (key === '±') cur = String(-parseFloat(cur));
      else if (key === '%') cur = String(parseFloat(cur) / 100);
      else if (key === '=') { if (op !== null) { cur = String(calc(prev, parseFloat(cur), op)); op = null; fresh = true; } }
      else { if (op !== null && !fresh) cur = String(calc(prev, parseFloat(cur), op)); prev = parseFloat(cur); op = key; fresh = true; b.classList.add('on'); }

  const save = () => store.set('health', hd);
  const draw = () => {
    const d = hd[today]; const b = page(win, 'Summary');
    const card = (ico, title, val, color, extra = '') => h(`<div class="list" style="padding:14px 16px"><div style="color:${color};font-weight:600">${ico} ${title}</div><div style="font-size:30px;font-weight:700;margin-top:6px">${val}</div>${extra}</div>`);
    const w = card('💧', 'Water', d.water + ' <span style="font-size:16px;color:var(--sub)">glasses</span>', '#32ade6', '<div style="display:flex;gap:8px;margin-top:8px"><button class="pbtn gray" style="margin:0">− 1</button><button class="pbtn" style="margin:0;background:#32ade6">＋ 1</button></div>');
    $$('button', w)[0].onclick = () => { d.water = Math.max(0, d.water - 1); save(); draw(); }; $$('button', w)[1].onclick = () => { d.water++; save(); draw(); buzz(); };
    const s = card('🔥', 'Steps', d.steps.toLocaleString(), '#ff3b30', '<button class="pbtn gray" style="margin:8px 0 0">Count steps while open</button>');
    $('button', s).onclick = async () => { try { if (window.DeviceMotionEvent?.requestPermission) await DeviceMotionEvent.requestPermission(); let last = 0; const fn = e => { const a = e.accelerationIncludingGravity; if (!a) return; const m = Math.hypot(a.x, a.y, a.z); if (m > 13 && Date.now() - last > 350) { last = Date.now(); d.steps++; save(); const v = s.querySelector('div:nth-child(2)'); if (v) v.textContent = d.steps.toLocaleString(); } }; window.addEventListener('devicemotion', fn); win._cleanup = () => window.removeEventListener('devicemotion', fn); toast('Counting… walk with your phone'); } catch { toast('Motion not available'); } };
    const m = card('🧠', 'Mood', d.mood || 'How do you feel?', '#5856d6', '<div style="display:flex;justify-content:space-between;font-size:30px;margin-top:8px">' + ['😫', '😕', '😐', '🙂', '🤩'].map(x => `<span style="cursor:pointer">${x}</span>`).join('') + '</div>');
    $$('span', m).forEach(x => x.onclick = () => { d.mood = x.textContent; save(); draw(); });
    b.append(w, s, m);
  };
  draw();
} });

/* ---------- News (Hacker News, public API) ---------- */
defineApp('news', { name: 'News', icon: '📰', bg: 'linear-gradient(#ff5a5f,#fa233b)', render(win) {
  const b = page(win, 'Top Stories'); b.appendChild(h('<div class="empty">Loading…</div>'));
  fetch('https://hacker-news.firebaseio.com/v0/topstories.json').then(r => r.json()).then(ids => Promise.all(ids.slice(0, 20).map(id => fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())))).then(items => {
    b.innerHTML = ''; b.appendChild(list(items.filter(Boolean).map(it => ({ title: it.title, sub: `▲ ${it.score} · ${it.by} · ${it.url ? new URL(it.url).hostname : 'news.ycombinator.com'}`, onclick: () => window.open(it.url || `https://news.ycombinator.com/item?id=${it.id}`, '_blank') }))));
  }).catch(() => { b.innerHTML = '<div class="empty">No connection</div>'; });
} });

/* ---------- Tips ---------- */
defineApp('tips', { name: 'Tips', icon: '💡', bg: 'linear-gradient(#ffd60a,#ff9f0a)', render(win) {
  const b = page(win, 'Tips');
  [['🔓', 'Unlock', 'Swipe up on the lock screen. Set a passcode in Settings → Face ID & Passcode.'], ['🎛️', 'Control Center', 'Swipe down from the top (or tap the status bar). Flashlight, dark mode, music, brightness.'], ['🔀', 'App Switcher', 'Swipe up on the bar at the bottom of the home screen, or swipe up and hold in an app. Flick cards up to close.'], ['✏️', 'Edit Home Screen', 'Long-press any icon. Tap two icons to swap, tap − to remove. Get apps back in the App Store.'], ['☁️', 'Cloud', 'Sign in from Settings to back up everything. Download a backup file to move to another phone.'], ['💬', 'Siri', 'Open Messages and chat with Siri: ask for the time, a joke, the weather, or some math.'], ['📲', 'Install', 'In Safari tap Share → Add to Home Screen for the full-screen app experience.'], ['🛠️', 'Make it better', 'iOS Rebuilt is open source! Add your own app on GitHub: github.com/mrcodelover1211/IOS-rebuilt-']].forEach(([i, t, d]) => b.appendChild(h(`<div class="list" style="padding:16px"><div style="font-size:32px">${i}</div><div style="font-weight:700;font-size:18px;margin:6px 0">${t}</div><div style="color:var(--sub)">${d}</div></div>`)));
} });

/* ---------- App Store ---------- */
defineApp('appstore', { name: 'App Store', icon: '🛍️', bg: 'linear-gradient(#1ac8fc,#1a73f5)', render(win) {
  const draw = () => {
    const b = page(win, 'Apps');
    b.appendChild(h('<div style="background:linear-gradient(135deg,#5b4bff,#ff8a5b);color:#fff;border-radius:18px;padding:20px;margin-bottom:20px"><div style="font-size:12px;opacity:.8;font-weight:600">OPEN SOURCE</div><div style="font-size:24px;font-weight:700;margin:4px 0">Build your own app</div><div style="opacity:.9">Every app here is ~50 lines of JavaScript. Fork iOS Rebuilt on GitHub and add yours.</div></div>'));
    Object.values(APPS).filter(a => !a.hidden && !DOCK.includes(a.id)).forEach(a => {
      const inst = !removed.includes(a.id);
      const c = h(`<div class="store-card"><div class="icon" style="background:${a.bg}">${a.icon}</div><div style="flex:1"><div style="font-weight:600">${esc(a.name)}</div><small style="color:var(--sub)">${inst ? 'Installed' : 'Free'}</small></div><button class="getbtn">${inst ? 'OPEN' : 'GET'}</button></div>`);
      $('button', c).onclick = () => { if (inst) openApp(a.id); else { $('button', c).textContent = '⏳'; setTimeout(() => { installApp(a.id); toast(a.name + ' installed'); draw(); }, 700); } };
      b.appendChild(c);
    });
  };
  draw();
} });

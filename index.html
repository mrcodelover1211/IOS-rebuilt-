<head>

<title>iOS Rebuilt</title>
<style>
:root {
  --wall: linear-gradient(160deg, #5b4bff 0%, #c14bd8 50%, #ff8a5b 100%);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bg: #f2f2f7; --card: #fff; --text: #000; --sub: #8e8e93; --sep: #e5e5ea; --blue: #007aff;
}
.dark { --bg: #000; --card: #1c1c1e; --text: #fff; --sub: #8e8e93; --sep: #38383a; --blue: #0a84ff; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: var(--font); overscroll-behavior: none; touch-action: manipulation; }
input, textarea, select { font: 17px var(--font); user-select: text; -webkit-user-select: text; }
button { font-family: var(--font); cursor: pointer; }
#phone { position: fixed; inset: 0; background: var(--wall); background-size: cover; background-position: center; overflow: hidden; }
@media (min-width: 600px) { #phone { width: 390px; height: 844px; max-height: 96vh; inset: 0; margin: auto; border-radius: 54px; border: 12px solid #111; box-shadow: 0 0 0 2px #444, 0 30px 80px rgba(0,0,0,.6); } body { background: #1a1a1a; } }

/* Status bar */
.status { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--sat) + 12px) 28px 0; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; z-index: 80; pointer-events: none; transition: color .2s; }
.status.darktext { color: #000; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.batt { width: 25px; height: 12px; position: relative; border: 1.5px solid currentColor; border-radius: 4px; padding: 1px; opacity: .9; }
.batt i { display: block; height: 100%; width: 80%; background: currentColor; border-radius: 2px; }
.island { position: absolute; top: calc(var(--sat) + 8px); left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 90; transition: width .4s cubic-bezier(.2,.9,.25,1), height .4s; display: flex; align-items: center; justify-content: center; font-size: 13px; overflow: hidden; }
.island.wide { width: 220px; }
@media (max-width: 599px) { .island { display: none; } }

/* Lock screen */
#lock { position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; background: var(--wall); background-size: cover; background-position: center; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s; }
#lock.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
#lock .date { margin-top: calc(var(--sat) + 70px); font-size: 20px; font-weight: 500; opacity: .9; }
#lock .time { font-size: 92px; font-weight: 600; letter-spacing: -2px; line-height: 1; }
#lock .lnotes { width: 92%; margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
#lock .hint { position: absolute; bottom: calc(var(--sab) + 40px); font-size: 14px; opacity: .8; animation: bob 2s infinite; }
#lock .bar { position: absolute; bottom: calc(var(--sab) + 10px); width: 134px; height: 5px; background: #fff; border-radius: 3px; }
#lock .lbtn { position: absolute; bottom: calc(var(--sab) + 50px); width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,.3); backdrop-filter: blur(10px); display: grid; place-items: center; font-size: 22px; }
@keyframes bob { 50% { transform: translateY(-6px); opacity: .5; } }
#pass { position: absolute; inset: 0; z-index: 75; background: rgba(0,0,0,.55); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: none; flex-direction: column; align-items: center; padding-top: calc(var(--sat) + 90px); }
#pass.show { display: flex; }
#pass .dots { display: flex; gap: 18px; margin: 18px 0 40px; }
#pass .dots i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #fff; }
#pass .dots i.f { background: #fff; }
#pass .pad { display: grid; grid-template-columns: repeat(3, 78px); gap: 16px 26px; }
#pass .pad button { width: 78px; height: 78px; border-radius: 50%; border: 0; background: rgba(255,255,255,.2); color: #fff; font-size: 34px; }
#pass .pad button:active { background: rgba(255,255,255,.5); }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-12px); } 40%,80% { transform: translateX(12px); } }

/* Home screen */
#home { position: absolute; inset: 0; transition: transform .3s, filter .3s; }
#home.behind { transform: scale(.92); filter: blur(6px) brightness(.7); }
#pages { position: absolute; top: calc(var(--sat) + 56px); left: 0; right: 0; bottom: calc(var(--sab) + 140px); display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
#pages::-webkit-scrollbar { display: none; }
.page { min-width: 100%; scroll-snap-align: start; padding: 0 20px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 92px; column-gap: 10px; align-content: start; }
.dots-nav { position: absolute; bottom: calc(var(--sab) + 118px); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
.dots-nav i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); }
.dots-nav i.on { background: #fff; }
.widget { grid-column: span 2; grid-row: span 2; border-radius: 22px; padding: 14px; background: rgba(255,255,255,.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); margin-bottom: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
.widget .big { font-size: 40px; font-weight: 300; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
.icon > svg, .icon > div:not(.badge) { border-radius: 15px; }
.icon { width: 62px; height: 62px; border-radius: 15px; overflow: visible; color:#fff; display: grid; place-items: center; font-size: 32px; box-shadow: 0 4px 12px rgba(0,0,0,.25); transition: transform .15s; position: relative; }
.app:active .icon { transform: scale(.88); filter: brightness(.8); }
.app span.n { font-size: 11.5px; text-shadow: 0 1px 3px rgba(0,0,0,.5); white-space: nowrap; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #ff3b30; font-size: 13px; font-weight: 600; display: grid; place-items: center; }
.wiggle .icon { animation: wig .25s infinite alternate; }
.wiggle .app .del { display: grid; }
.del { display: none; position: absolute; top: -6px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: rgba(120,120,120,.9); place-items: center; font-size: 14px; z-index: 2; }
.app.picked .icon { outline: 3px solid #fff; }
@keyframes wig { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
.dock { position: absolute; left: 12px; right: 12px; bottom: calc(var(--sab) + 12px); padding: 14px 16px; border-radius: 32px; background: rgba(255,255,255,.22); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; justify-content: space-around; }
.dock .app span.n { display: none; }
.donebtn { position: absolute; top: calc(var(--sat) + 10px); right: 20px; z-index: 85; background: rgba(255,255,255,.3); border: 0; color: #fff; padding: 6px 14px; border-radius: 14px; font-weight: 600; display: none; }
.wiggle-on .donebtn { display: block; }
.spot { position: absolute; bottom: calc(var(--sab) + 108px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.25); backdrop-filter: blur(20px); padding: 5px 12px; border-radius: 14px; font-size: 13px; cursor: pointer; display: none; }
.home-bar { position: absolute; bottom: calc(var(--sab) + 4px); left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.6); }

/* Windows */
.window { position: absolute; inset: 0; z-index: 50; background: var(--bg); color: var(--text); display: flex; flex-direction: column; transform: scale(.08); opacity: 0; transition: transform .35s cubic-bezier(.2,.9,.25,1), opacity .25s, border-radius .35s; border-radius: 40px; overflow: hidden; }
.window.open { transform: scale(1); opacity: 1; border-radius: 0; }
.window.closing { transform: scale(.08); opacity: 0; border-radius: 40px; }
.window.darkwin { --bg: #000; --card: #1c1c1e; --text: #fff; --sep: #38383a; }
.nav { padding: calc(var(--sat) + 50px) 16px 6px; display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
.nav h1 { font-size: 34px; font-weight: 700; }
.navbar { padding: calc(var(--sat) + 50px) 12px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 600; }
.wbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--sab) + 40px); }
.closer { position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--sab) + 26px); display: flex; justify-content: center; align-items: flex-end; padding-bottom: calc(var(--sab) + 6px); z-index: 10; cursor: pointer; }
.closer i { width: 134px; height: 5px; border-radius: 3px; background: var(--text); opacity: .5; }
.link { background: none; border: 0; color: var(--blue); font-size: 17px; padding: 6px 4px; display: inline-flex; align-items: center; gap: 4px; }
.link.red { color: #ff3b30; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 22px; }
.cell { padding: 11px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: center; border-bottom: .5px solid var(--sep); font-size: 17px; min-height: 44px; cursor: pointer; }
.cell:last-child { border-bottom: 0; }
.cell:active { background: var(--sep); }
.cell .l { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
.cell .l > div { min-width: 0; }
.cell small { color: var(--sub); font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .r { color: var(--sub); white-space: nowrap; }
.sq { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
.label { font-size: 13px; color: var(--sub); text-transform: uppercase; margin: 0 16px 6px; }
.search { width: 100%; padding: 8px 12px; border-radius: 10px; border: 0; background: var(--sep); color: var(--text); margin-bottom: 14px; outline: none; }
.field { width: 100%; padding: 12px 14px; border: 0; background: var(--card); color: var(--text); border-radius: 10px; outline: none; margin-bottom: 10px; }
.pbtn { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.pbtn.gray { background: var(--card); color: var(--blue); }
.empty { text-align: center; color: var(--sub); padding: 40px 0; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: #e9e9ea; position: relative; transition: background .2s; flex-shrink: 0; }
.dark .switch { background: #39393d; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on { background: #34c759; }
.switch.on::after { transform: translateX(20px); }
.seg { display: flex; background: var(--sep); border-radius: 9px; padding: 2px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text); }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.tabs { display: flex; justify-content: space-around; border-top: .5px solid var(--sep); padding: 6px 0 calc(var(--sab) + 26px); background: var(--card); }
.tabs button { border: 0; background: none; color: var(--sub); font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button b { font-size: 22px; font-weight: normal; }
.tabs button.on { color: var(--blue); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(#a8adb8, #858994); color: #fff; display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }

/* Banner notifications */
#banner { position: absolute; top: calc(var(--sat) + 8px); left: 8px; right: 8px; z-index: 95; background: rgba(245,245,245,.85); color: #000; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; transform: translateY(-150%); transition: transform .4s cubic-bezier(.2,.9,.25,1); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
#banner.show { transform: none; }
.ncard { background: rgba(255,255,255,.3); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 18px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.ncard .sq { width: 36px; height: 36px; }

/* Control Center */
#cc { position: absolute; inset: 0; z-index: 88; background: rgba(0,0,0,.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: calc(var(--sat) + 60px) 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start; transform: translateY(-100%); transition: transform .35s cubic-bezier(.2,.9,.25,1); }
#cc.open { transform: none; }
.tile { background: rgba(255,255,255,.18); border-radius: 22px; padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; justify-items: center; }
.tog { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.25); border: 0; font-size: 24px; }
.tog.on { background: var(--blue); }
.tog.on.orange { background: #ff9f0a; }
.slider { background: rgba(255,255,255,.18); border-radius: 22px; height: 150px; position: relative; overflow: hidden; touch-action: none; }
.slider i { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; height: 60%; }
.slider span { position: absolute; bottom: 14px; left: 0; right: 0; display:flex; justify-content:center; color:#8e8e93; }
.ccmusic { grid-column: span 2; background: rgba(255,255,255,.18); border-radius: 22px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
.ccmusic button { background: none; border: 0; color: #fff; font-size: 26px; }
#dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 200; }

/* Switcher */
#switcher { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: none; align-items: center; overflow-x: auto; gap: 18px; padding: 0 40px; scroll-snap-type: x mandatory; }
#switcher.show { display: flex; }
.card { min-width: 70%; height: 65%; border-radius: 30px; background: #f2f2f7; color:#000; box-shadow:0 20px 50px rgba(0,0,0,.4); scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 60px; position: relative; transition: transform .3s, opacity .3s; }
.card span { font-size: 16px; }
.card.gone { transform: translateY(-120%); opacity: 0; }

/* Spotlight */
#spotlight { position: absolute; inset: 0; z-index: 65; background: rgba(0,0,0,.45); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: calc(var(--sat) + 60px) 16px; display: none; flex-direction: column; }
#spotlight.show { display: flex; }
#spotlight input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 0; background: rgba(255,255,255,.2); color: #fff; outline: none; }
#spotlight input::placeholder { color: rgba(255,255,255,.6); }
#spotRes { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; margin-top: 20px; }

/* App-specific */
.calc { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 0 16px calc(var(--sab) + 36px); }
.calc .out { font-size: 80px; font-weight: 300; text-align: right; padding: 0 12px 10px; overflow: hidden; white-space: nowrap; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.keys button { aspect-ratio: 1; border: 0; border-radius: 50%; font-size: 32px; background: #333; color: #fff; }
.keys button:active { filter: brightness(1.6); }
.keys .fn { background: #a5a5a5; color: #000; }
.keys .op { background: #ff9f0a; }
.keys .op.on { background: #fff; color: #ff9f0a; }
.keys .zero { grid-column: span 2; aspect-ratio: auto; border-radius: 40px; text-align: left; padding-left: 30px; }
textarea.note { width: 100%; height: 100%; min-height: 60vh; border: 0; background: transparent; resize: none; outline: none; color: var(--text); }
.bigclock { font-size: 76px; font-weight: 200; text-align: center; margin: 30px 0; font-variant-numeric: tabular-nums; }
.row { display: flex; justify-content: space-between; padding: 0 10px; }
.circle { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--bg); outline: 2px solid #333; font-size: 17px; color: #fff; background: #333; }
.circle.go { background: #0a3a17; color: #30d158; outline-color: #0a3a17; }
.circle.stop { background: #3a0f0d; color: #ff453a; outline-color: #3a0f0d; }
.circle.pause { background: #3a2a0a; color: #ff9f0a; outline-color: #3a2a0a; }
.laps div { display: flex; justify-content: space-between; padding: 12px 6px; border-bottom: .5px solid var(--sep); font-variant-numeric: tabular-nums; }
.dial { display: grid; grid-template-columns: repeat(3, 78px); gap: 16px 26px; justify-content: center; margin-top: 10px; }
.dial button { width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--sep); color: var(--text); font-size: 32px; line-height: 1; }
.dial button small { display: block; font-size: 10px; letter-spacing: 2px; }
.callbtn { width: 78px; height: 78px; border-radius: 50%; border: 0; background: #34c759; color: #fff; font-size: 32px; margin: 18px auto 0; display: block; }
.bubbles { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
.bub { max-width: 75%; padding: 8px 13px; border-radius: 18px; font-size: 16px; line-height: 1.3; word-wrap: break-word; user-select: text; }
.bub.me { align-self: flex-end; background: var(--blue); color: #fff; }
.bub.them { align-self: flex-start; background: var(--sep); color: var(--text); }
.composer { display: flex; gap: 8px; padding: 8px 12px calc(var(--sab) + 30px); border-top: .5px solid var(--sep); background: var(--bg); }
.composer input { flex: 1; padding: 8px 14px; border-radius: 18px; border: 1px solid var(--sep); background: var(--bg); color: var(--text); outline: none; }
.composer button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; font-size: 18px; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 -16px; }
.pgrid div { aspect-ratio: 1; background-size: cover; background-position: center; cursor: pointer; }
.viewer { position: absolute; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; }
.viewer img { flex: 1; object-fit: contain; width: 100%; min-height: 0; }
.viewer .vbar { display: flex; justify-content: space-around; padding: 12px 0 calc(var(--sab) + 30px); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; row-gap: 6px; }
.month b { font-size: 12px; color: var(--sub); font-weight: 500; }
.month span { padding: 8px 0; border-radius: 50%; width: 38px; height: 38px; margin: auto; font-size: 17px; position: relative; cursor: pointer; }
.month span.today { color: #ff3b30; font-weight: 700; }
.month span.sel { background: #ff3b30; color: #fff; }
.month span.has::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--sub); }
.chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c7c7cc; flex-shrink: 0; display: grid; place-items: center; }
.chk.on { background: #ff9f0a; border-color: #ff9f0a; }
.chk.on::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.store-card { background: var(--card); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.store-card .icon { width: 62px; height: 62px; border-radius: 15px; box-shadow: 0 1px 4px rgba(0,0,0,.15); flex-shrink:0; }
.getbtn { border: 0; background: var(--sep); color: var(--blue); font-weight: 700; padding: 6px 18px; border-radius: 16px; font-size: 15px; }
.art { width: 72%; aspect-ratio: 1; margin: 20px auto; border-radius: 14px; display: grid; place-items: center; font-size: 100px; box-shadow: 0 20px 40px rgba(0,0,0,.3); transition: transform .4s; }
.art.paused { transform: scale(.85); }
.progress { height: 6px; border-radius: 3px; background: var(--sep); overflow: hidden; margin: 18px 6px 6px; }
.progress i { display: block; height: 100%; background: var(--sub); width: 0; }
.mctl { display: flex; justify-content: space-around; font-size: 40px; margin: 20px 0; }
.mctl button { background: none; border: 0; color: var(--text); font-size: 40px; }
.compass { width: 260px; height: 260px; border-radius: 50%; border: 3px solid #555; margin: 40px auto; position: relative; transition: transform .2s; }
.compass b { position: absolute; font-size: 22px; }
iframe.map { width: 100%; height: 100%; border: 0; }
.cloudbar { height: 10px; border-radius: 5px; background: var(--sep); overflow: hidden; display: flex; margin: 10px 0; }
.toast { position: absolute; bottom: calc(var(--sab) + 90px); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 15px; z-index: 99; }

.modal { position: absolute; inset: 0; z-index: 150; background: rgba(0,0,0,0); display: grid; place-items: center; transition: background .2s; }
.modal.show { background: rgba(0,0,0,.35); }
.alert { width: 270px; border-radius: 14px; background: rgba(242,242,247,.92); color: #000; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); overflow: hidden; transform: scale(1.15); opacity: 0; transition: transform .2s, opacity .2s; }
.dark .alert, .dark .asheet .agroup { background: rgba(44,44,46,.92); color: #fff; }
.modal.show .alert { transform: none; opacity: 1; }
.atext { padding: 18px 16px 16px; text-align: center; font-size: 13px; }
.atext b { display: block; font-size: 17px; margin-bottom: 4px; }
.ain { width: 100%; margin-top: 12px; padding: 7px 8px; border-radius: 7px; border: .5px solid #c7c7cc; background: #fff; color: #000; font-size: 15px; outline: none; }
.abtns { display: flex; border-top: .5px solid rgba(60,60,67,.3); }
.abtns.stack { flex-direction: column; }
.abtns button, .agroup button { flex: 1; padding: 12px; border: 0; background: none; color: #007aff; font-size: 17px; }
.abtns button + button { border-left: .5px solid rgba(60,60,67,.3); }
.abtns.stack button + button { border-left: 0; border-top: .5px solid rgba(60,60,67,.3); }
.abtns .bold, .agroup .bold { font-weight: 600; }
.abtns .red, .agroup .red { color: #ff3b30; }
.sheetm { place-items: end stretch; padding: 0 8px calc(var(--sab) + 8px); }
.asheet { transform: translateY(110%); transition: transform .3s cubic-bezier(.2,.9,.25,1); }
.modal.show .asheet { transform: none; }
.agroup { background: rgba(242,242,247,.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 14px; overflow: hidden; margin-top: 8px; display: flex; flex-direction: column; }
.agroup button { padding: 17px; font-size: 20px; border-top: .5px solid rgba(60,60,67,.2); }
.agroup button:active, .abtns button:active { background: rgba(0,0,0,.08); }
.stitle { padding: 14px; text-align: center; font-size: 13px; color: #8e8e93; }
.browser-bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px calc(var(--sab) + 30px); background: var(--card); border-top: .5px solid var(--sep); }
.browser-bar input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 12px; border: 0; background: var(--sep); color: var(--text); text-align: center; outline: none; }
.browser-bar button { background: none; border: 0; color: var(--blue); display: grid; place-items: center; padding: 4px; }
iframe.web { flex: 1; width: 100%; border: 0; background: #fff; }
.tile2048 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #bbada0; padding: 8px; border-radius: 10px; touch-action: none; }
.tile2048 div { aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 26px; background: #cdc1b4; color: #776e65; transition: transform .1s; }
</style>

  const set = y => { const r = el.getBoundingClientRect(); const v = Math.max(0, Math.min(1, (r.bottom - y) / r.height)); el.querySelector('i').style.height = v * 100 + '%'; cb(v); };
  el.querySelector('i').style.height = init * 100 + '%';
  el.addEventListener('touchstart', e => { e.stopPropagation(); set(e.touches[0].clientY); }, { passive: true });
  el.addEventListener('touchmove', e => { e.stopPropagation(); set(e.touches[0].clientY); }, { passive: true });
  el.addEventListener('touchend', e => e.stopPropagation());
  let down = false; el.onmousedown = e => { down = true; set(e.clientY); }; window.addEventListener('mousemove', e => down && set(e.clientY)); window.addEventListener('mouseup', () => down = false);
}

/* =====================================================================
   CLOUD — "iCloud-style" sync. Data lives on-device; Cloud makes
   backups you can download, restore, or move to another device.
   ===================================================================== */
let cloudTimer;
function cloudSync() {
  if (!settings.cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => {
    const snap = store.all(); delete snap.cloudBackups;
    const backups = store.get('cloudBackups', []);
    backups.unshift({ t: Date.now(), size: JSON.stringify(snap).length });
    store.set('cloudBackups', backups.slice(0, 5));
    store.set('lastSync', Date.now());
  }, 1500);
}
function exportBackup() {
  const data = store.all(); data._meta = { app: 'iOS Rebuilt', version: 2, t: Date.now() };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ios-rebuilt-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
}
function importBackup() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
  i.onchange = () => { const f = i.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = async () => {
    try { const d = JSON.parse(rd.result); if (!d._meta) throw new Error('Not an iOS Rebuilt backup'); if (!await uiConfirm('Restore this backup? Current data will be replaced.')) return; store.clear(); Object.entries(d).forEach(([k, v]) => k !== '_meta' && store.set(k, v)); location.reload(); }
    catch (e) { uiAlert('Restore failed: ' + e.message); } }; rd.readAsText(f); };
  i.click();
}

const BOT = 'Siri';
function botReply(text) {
  const t = text.toLowerCase();
  if (/\b(hi|hey|hello|yo)\b/.test(t)) return `Hey${settings.name ? ' ' + settings.name : ''}! 👋 Ask me the time, a joke, or to flip a coin.`;
  if (t.includes('time')) return `It's ${fmtTime(Date.now())}. ⏰`;
  if (t.includes('date') || t.includes('day')) return `Today is ${new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}.`;
  if (t.includes('joke')) return ['Why did the iPhone go to school? To improve its cell-f esteem. 📱', 'I would tell you a UDP joke, but you might not get it.', 'My battery and I have a lot in common: both drain fast around you. 🔋'][Math.floor(Math.random() * 3)];
  if (t.includes('coin')) return Math.random() < .5 ? 'Heads! 🪙' : 'Tails! 🪙';
  if (t.includes('dice') || t.includes('roll')) return `🎲 ${1 + Math.floor(Math.random() * 6)}`;
  if (t.includes('weather')) { const w = store.get('wxcache'); return w ? `It's ${Math.round(w.temp)}° and ${w.desc.toLowerCase()} in ${w.city}.` : 'Open the Weather app first and I\'ll remember it. ⛅'; }
  if (t.includes('note')) return 'Open Notes to jot that down 📝 — everything is backed up to Cloud.';
  if (/[\d)]\s*[-+*/x×÷]\s*[\d(]/.test(t)) { try { const ex = t.replace(/[x×]/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/().\s]/g, ''); const v = Function('"use strict";return (' + ex + ')')(); if (isFinite(v)) return `That's ${+v.toFixed(8)} 🧮`; } catch {} }
  if (t.includes('love')) return 'Aw. I\'m just a few lines of JavaScript, but ❤️.';
  if (t.includes('who are you') || t.includes('your name')) return 'I\'m the built-in assistant of iOS Rebuilt. Open source, so you can make me smarter on GitHub!';
  return ['Interesting! Tell me more.', 'Hmm, I\'m not sure about that one yet. 🤔', 'Noted! (Not really, try the Notes app.)', '👍'][Math.floor(Math.random() * 4)];
}

/* ---------- Clock: World, Alarm, Stopwatch, Timer ---------- */
let alarms = store.get('alarms', []);
let lastAlarmMin = '';
function checkAlarms(d) {
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (hm === lastAlarmMin) return;
  alarms.filter(a => a.on && a.time === hm).forEach(a => { notify('clock', 'Alarm', a.label || 'Alarm ⏰'); beepAlarm(); });
  store.get('reminders', []).filter(r => !r.done && r.due && Math.abs(r.due - d.getTime()) < 30000).forEach(r => notify('reminders', 'Reminder', r.text));
  lastAlarmMin = hm;
}
function beepAlarm() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < 6; i++) { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .2; o.connect(g).connect(c.destination); o.start(c.currentTime + i * .4); o.stop(c.currentTime + i * .4 + .2); } } catch {} buzz([200, 100, 200, 100, 200]); }
const SW = { start: 0, elapsed: 0, running: false, laps: [] };
const TM = { end: 0, left: 0, running: false, total: 0 };
defineApp('clock', { name: 'Clock', icon: '⏰', bg: '#000', dark: true, render(win) {
  let tab = store.get('clockTab', 'Stopwatch'), raf;
  const f = ms => { const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, c = Math.floor(ms / 10) % 100; return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`; };
  const fT = ms => { const s = Math.ceil(ms / 1000); return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const swNow = () => SW.elapsed + (SW.running ? performance.now() - SW.start : 0);
  const draw = () => {
    cancelAnimationFrame(raf); store.set('clockTab', tab);
    win.innerHTML = '';
    const content = h('<div style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>'); win.appendChild(content);
    const tabs = h('<div class="tabs"></div>');
    [['earth', 'World Clock'], ['bell', 'Alarm'], ['timer', 'Stopwatch'], ['hourglass', 'Timer']].forEach(([i, n]) => { const t = h(`<button class="${tab === n ? 'on' : ''}" style="${tab === n ? 'color:#ff9f0a' : ''}"><b>${I(i, 24)}</b>${n}</button>`); t.onclick = () => { tab = n; draw(); }; tabs.appendChild(t); });
    win.appendChild(tabs);
    if (tab === 'World Clock') {
      const zones = store.get('zones', ['America/New_York', 'Europe/London', 'Asia/Tokyo', 'Australia/Sydney']);
      const b = page(content, 'World Clock', { actions: [[I('plus', 26), async () => { const z = await uiAsk('Time zone (e.g. Europe/Paris, Asia/Dubai)'); if (!z) return; try { new Intl.DateTimeFormat([], { timeZone: z }); zones.push(z); store.set('zones', zones); draw(); } catch { toast('Unknown time zone'); } }]] });
      const l = list(zones.map(z => ({ title: z.split('/').pop().replace(/_/g, ' '), sub: z.split('/')[0], right: `<span style="font-size:36px;font-weight:300;color:var(--text)">${new Date().toLocaleTimeString([], { timeZone: z, hour: 'numeric', minute: '2-digit' })}</span>`, onclick: async () => { if (await uiConfirm('Remove ' + z + '?')) { store.set('zones', zones.filter(x => x !== z)); draw(); } } })));

      const row = h(`<div class="row"><button class="circle">${SW.running ? 'Lap' : 'Reset'}</button><button class="circle ${SW.running ? 'stop' : 'go'}">${SW.running ? 'Stop' : 'Start'}</button></div>`);

        [1, 3, 5, 10, 25].forEach(m => { const x = h(`<button class="pbtn gray" style="width:auto;padding:8px 14px">${m} min</button>`); x.onclick = () => { TM.total = m * 60000; TM.end = Date.now() + TM.total; TM.running = true; scheduleTimer(); draw(); }; presets.appendChild(x); });
        b.appendChild(presets);
      } else {

        const row = h(`<div class="row"><button class="circle">Cancel</button><button class="circle ${TM.running ? 'pause' : 'go'}">${TM.running ? 'Pause' : 'Resume'}</button></div>`);
        row.children[0].onclick = () => { TM.running = false; TM.left = 0; clearTimeout(TM.t); draw(); };
        row.children[1].onclick = () => { if (TM.running) { TM.left = left(); TM.running = false; clearTimeout(TM.t); } else { TM.end = Date.now() + TM.left; TM.running = true; scheduleTimer(); } draw(); };

  draw();
} });
function scheduleTimer() { clearTimeout(TM.t); TM.t = setTimeout(() => { TM.running = false; TM.left = 0; notify('clock', 'Timer', 'Timer done! ⏲️'); beepAlarm(); }, TM.end - Date.now()); }

      const nowH = new Date().getHours(), start = r.hourly.time.findIndex(t => new Date(t).getHours() === nowH && new Date(t).getDate() === new Date().getDate());

defineApp('calc', { name: 'Calculator', icon: '🧮', bg: '#1c1c1e', dark: true, render(win) {
  win.style.background = '#000';
  const w = h('<div class="calc"><div class="out">0</div><div class="keys"></div></div>'); win.appendChild(w);
  const out = $('.out', w);
  let cur = '0', prev = null, op = null, fresh = false;
  const fmt = n => { if (!isFinite(n)) return 'Error'; const s = String(+parseFloat(n).toPrecision(10)); return s.length > 9 ? (+s).toExponential(4) : (+s).toLocaleString('en-US', { maximumFractionDigits: 8 }); };
  const show = () => { out.textContent = cur.endsWith('.') ? cur : fmt(cur); out.style.fontSize = out.textContent.length > 7 ? '56px' : '80px'; $('.keys button', w).textContent = cur === '0' && !op ? 'AC' : 'C'; };
  const calc = (a, b, o) => ({ '+': a + b, '−': a - b, '×': a * b, '÷': a / b })[o];
  ['AC', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '='].forEach(k => {
    const b = h(`<button>${k}</button>`); b.className = ['AC', '±', '%'].includes(k) ? 'fn' : '÷×−+='.includes(k) ? 'op' : k === '0' ? 'zero' : '';
    b.onclick = () => {
      buzz(); $$('.keys .op', w).forEach(x => x.classList.remove('on')); const key = b.textContent;
      if (/\d/.test(key)) { cur = fresh || cur === '0' ? key : (cur.replace(/[-.]/g, '').length < 9 ? cur + key : cur); fresh = false; }
      else if (key === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; }
      else if (key === 'AC') { cur = '0'; prev = op = null; }
      else if (key === 'C') { cur = '0'; }
      else if (key === '±') cur = String(-parseFloat(cur));
      else if (key === '%') cur = String(parseFloat(cur) / 100);
      else if (key === '=') { if (op !== null) { cur = String(calc(prev, parseFloat(cur), op)); op = null; fresh = true; } }
      else { if (op !== null && !fresh) cur = String(calc(prev, parseFloat(cur), op)); prev = parseFloat(cur); op = key; fresh = true; b.classList.add('on'); }
      show();
    };
    $('.keys', w).appendChild(b);
  });
} });

defineApp('voice', { name: 'Voice Memos', icon: '🎙️', bg: '#1c1c1e', dark: true, render(win) {
  const memos = []; // kept in memory (audio is too big for localStorage)

    const b = page(win, 'All Recordings');
    if (window._memos?.length) b.appendChild(list(window._memos.map((m, i) => ({ title: 'New Recording ' + (i + 1), sub: fmtTime(m.t), right: '▶️', onclick: () => new Audio(m.url).play() }))));

    const btn = h(`<button style="display:block;margin:30px auto;width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:#ff3b30;${rec ? 'border-radius:14px;width:50px;height:50px' : ''}"></button>`);

/* ---------- Health (step-ish counter via motion + water tracker) ---------- */
defineApp('health', { name: 'Health', icon: '❤️', bg: '#fff', render(win) {
  const today = dayKey(new Date());
  const hd = store.get('health', {}); hd[today] = hd[today] || { water: 0, steps: 0, mood: '' };
  const save = () => store.set('health', hd);
  const draw = () => {
    const d = hd[today]; const b = page(win, 'Summary');
    const card = (ico, title, val, color, extra = '') => h(`<div class="list" style="padding:14px 16px"><div style="color:${color};font-weight:600">${ico} ${title}</div><div style="font-size:30px;font-weight:700;margin-top:6px">${val}</div>${extra}</div>`);
    const w = card('💧', 'Water', d.water + ' <span style="font-size:16px;color:var(--sub)">glasses</span>', '#32ade6', '<div style="display:flex;gap:8px;margin-top:8px"><button class="pbtn gray" style="margin:0">− 1</button><button class="pbtn" style="margin:0;background:#32ade6">＋ 1</button></div>');
    $$('button', w)[0].onclick = () => { d.water = Math.max(0, d.water - 1); save(); draw(); }; $$('button', w)[1].onclick = () => { d.water++; save(); draw(); buzz(); };
    const s = card('🔥', 'Steps', d.steps.toLocaleString(), '#ff3b30', '<button class="pbtn gray" style="margin:8px 0 0">Count steps while open</button>');
    $('button', s).onclick = async () => { try { if (window.DeviceMotionEvent?.requestPermission) await DeviceMotionEvent.requestPermission(); let last = 0; const fn = e => { const a = e.accelerationIncludingGravity; if (!a) return; const m = Math.hypot(a.x, a.y, a.z); if (m > 13 && Date.now() - last > 350) { last = Date.now(); d.steps++; save(); const v = s.querySelector('div:nth-child(2)'); if (v) v.textContent = d.steps.toLocaleString(); } }; window.addEventListener('devicemotion', fn); win._cleanup = () => window.removeEventListener('devicemotion', fn); toast('Counting… walk with your phone'); } catch { toast('Motion not available'); } };
    const m = card('🧠', 'Mood', d.mood || 'How do you feel?', '#5856d6', '<div style="display:flex;justify-content:space-between;font-size:30px;margin-top:8px">' + ['😫', '😕', '😐', '🙂', '🤩'].map(x => `<span style="cursor:pointer">${x}</span>`).join('') + '</div>');
    $$('span', m).forEach(x => x.onclick = () => { d.mood = x.textContent; save(); draw(); });
    b.append(w, s, m);
  };
  draw();
} });
